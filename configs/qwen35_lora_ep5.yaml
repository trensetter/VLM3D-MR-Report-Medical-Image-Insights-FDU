# Sanitized summary of the submitted checkpoint's recorded SFT configuration.
# Private dataset locations and host-specific paths are intentionally omitted.
model_family: Qwen3.5-4B
checkpoint_identifier: checkpoint-4825
initialized_from_checkpoint: checkpoint-1930
dataset_identifier: MR-RATE 1:4-clean CoT training split
training:
  fine_tuning: LoRA
  lora_rank: 64
  lora_alpha: 128
  lora_dropout: 0.05
  use_rslora: true
  target_modules: all-linear
  epochs: 5
  learning_rate: 5.0e-5
  max_sequence_length: 81920
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  world_size: 4
  effective_global_batch_size: 64
  deepspeed: zero2
  optimizer: adamw_torch_fused
  weight_decay: 0.1
  warmup_steps: 100
  lr_scheduler: cosine
  seed: 42
  dtype: bfloat16
  attention: flash_attention_2
inference:
  runtime: ms-swift TransformersEngine
  batch_size: 4
  preprocessing: sequential_per_study
  attention: sdpa
  max_new_tokens: 2048
  temperature: 0
  dtype: bfloat16
  template: med-Qwen3-5-multi-channel-wl
  input_modalities: [T1w, T2w, FLAIR]
  output: report body only, one record per study
runtime:
  offline: true
  container_user: appuser
  checkpoint_dir: /checkpoint
  input_dir: /input
  output_dir: /output
  weights_dir: /weights
  historical_submission_fail_fast: false
  public_template_fail_fast: true
